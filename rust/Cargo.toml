[package]
name = "anon-network-guard"
description = "Anon Network Guard native messaging helper for Linux and Windows"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false
# The shipped version comes from Sources/NetworkHelperCore/BuildVersion.swift (see build.rs).
version = "0.0.0"

[lib]
name = "network_guard"
path = "src/lib.rs"

[[bin]]
name = "anon-network-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "anon-network-guard-setup"
path = "src/bin/setup.rs"

[features]
# Builds the development channel: host inc.anon.network_helper.dev and the
# development extension id. Without it the build is the production channel.
development = []

[dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
