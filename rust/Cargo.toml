[package]
name = "anon-network-guard"
description = "Anon Network Guard native messaging helper for Linux and Windows"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false
# The shipped version comes from Sources/NetworkHelperCore/BuildVersion.swift (see build.rs).
version = "0.0.0"

[lib]
name = "network_guard"
path = "src/lib.rs"

[[bin]]
name = "anon-network-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "anon-network-guard-setup"
path = "src/bin/setup.rs"

[features]
# Builds the development channel: host inc.anon.network_helper.dev and the
# development extension id. Without it the build is the production channel.
development = []

[dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
